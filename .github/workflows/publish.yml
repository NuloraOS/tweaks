name: Publish all tweaks together
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use verified camera builds directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-input.py
      - run: python3 sync.py
      - name: Validate Sileo Release contract and package integrity
        run: python3 check_repo.py
      - name: Keep all DEBs together in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 stage_repo.py
          git diff --cached --quiet || git commit -m 'Update two cameras and Dock; retire Glass and Motion'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
